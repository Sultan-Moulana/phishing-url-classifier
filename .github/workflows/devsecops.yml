name: Shift-Left DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-sast:
    name: Unit Tests & SonarCloud SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Train Model
        run: |
          pip install -r requirements.txt
          python train_model.py

      - name: Run Pytest Suite
        run: pytest -v

      - name: SonarCloud SAST Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  container-security-gate:
    name: Build & AquaSec Trivy Vulnerability Scan
    needs: test-and-sast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # SCA: Filesystem / dependency scan
      - name: Run Trivy Filesystem & Dependency Scan (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Upload Filesystem Scan Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "trivy-fs"

      # Build
      - name: Build Hardened Docker Image
        run: docker build -t phishguard-ml:${{ github.sha }} .

      # Image scan
      - name: Run Trivy Container Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "phishguard-ml:${{ github.sha }}"
          format: "sarif"
          output: "trivy-image-results.sarif"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Upload Image Scan Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image-results.sarif"
          category: "trivy-image"